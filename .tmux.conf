%if #{>=:#{version},3.3}
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
%endif

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Prefix: Ctrl-Space instead of the default Ctrl-b -- doesn't collide with
# anything readline uses (unlike Ctrl-a, which still needs a double-tap
# workaround), and is an easier reach than Ctrl-b. Relies on extended-keys
# above to disambiguate from a bare NUL byte.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000

# Faster escape (avoids lag on bare Esc, e.g. readline/fzf)
set -sg escape-time 10

# Split keys: - and . sit next to each other, no AltGr needed on Swiss layout
bind - split-window -v -c "#{pane_current_path}"
bind . split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
