%if #{>=:#{version},3.3}
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
%endif

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Prefix: Ctrl-Space instead of the default Ctrl-b -- doesn't collide with
# anything readline uses (unlike Ctrl-a, which still needs a double-tap
# workaround), and is an easier reach than Ctrl-b. Relies on extended-keys
# above to disambiguate from a bare NUL byte.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000

# Faster escape (avoids lag on bare Esc, e.g. readline/fzf)
set -sg escape-time 10

# Split keys: - and . sit next to each other, no AltGr needed on Swiss layout
bind - split-window -v -c "#{pane_current_path}"
bind . split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Status bar -- dusty/muted 256-color palette, matches the p10k prompt.
# Bar background is Ghostty's actual default bg (#282c34, since ghostty/config
# never overrides it); separators are the same nerdfont-complete powerline
# glyphs (E0B0/E0B2) p10k uses.
#
# Design, mirrored left/right: one accent anchors each outer screen edge
# (violet = session identity on the left, sage = clock on the right) and
# tapers back into the plain bar background. A second accent (slate-blue)
# means "active/focused" wherever it shows up -- current window, active pane
# border, tmux messages. Everything else is plain text on the bar background,
# same density on both sides -- no stacked solid blocks.
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#282c34,fg=colour255"

set -g status-left-length 30
set -g status-left "#[bg=colour97,fg=colour255,bold] #S #[fg=colour97,bg=#282c34]"

setw -g window-status-style "fg=colour245,bg=#282c34"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#282c34,bg=colour67]#[bg=colour67,fg=colour255,bold] #I:#W #[fg=colour67,bg=#282c34]"
setw -g window-status-separator ""

set -g status-right-length 40
set -g status-right "#[fg=colour245,bg=#282c34] %d %b #[fg=colour71,bg=#282c34]#[bg=colour71,fg=colour255,bold] %H:%M "

# Pane borders + messages reuse the "active" accent (slate-blue)
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour67"
set -g message-style "bg=colour67,fg=colour255"
